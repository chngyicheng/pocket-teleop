<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="pocket-teleop — drive a ROS2 robot from your phone browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14171e"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
  </defs>

  <!-- Panel -->
  <rect x="1" y="1" width="878" height="198" rx="10" fill="url(#bg)" stroke="#2a2f3a" stroke-width="1.5"/>

  <!-- Faint grid, echoing the HUD minimap -->
  <g stroke="#4ec9d6" stroke-opacity="0.06" stroke-width="1">
    <path d="M40 0V200 M80 0V200 M120 0V200 M160 0V200 M200 0V200 M240 0V200 M280 0V200 M320 0V200 M360 0V200 M400 0V200 M440 0V200 M480 0V200 M520 0V200 M560 0V200 M600 0V200 M640 0V200 M680 0V200 M720 0V200 M760 0V200 M800 0V200 M840 0V200"/>
    <path d="M0 40H880 M0 80H880 M0 120H880 M0 160H880"/>
  </g>

  <!-- Status chip, like the UI top bar -->
  <g transform="translate(48,40)">
    <rect x="0" y="0" width="150" height="22" rx="3" fill="none" stroke="#22c55e" stroke-opacity="0.4"/>
    <circle cx="14" cy="11" r="4" fill="#22c55e"/>
    <text x="26" y="15" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" letter-spacing="1" fill="#22c55e">LIVE · TELEOP</text>
  </g>

  <!-- Wordmark — mono, uppercase, amber accent dot (matches the HUD header) -->
  <text x="46" y="120" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="54" font-weight="700" letter-spacing="2" fill="#e6e9ef">POCKET<tspan fill="#f0a92a">-</tspan>TELEOP</text>

  <!-- Tagline — sans, muted -->
  <text x="48" y="156" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="17" fill="#8a92a3">Drive a ROS2 robot from your phone browser — no laptop required.</text>

  <!-- Accent rule -->
  <rect x="48" y="170" width="320" height="2" rx="1" fill="#f0a92a" fill-opacity="0.8"/>
</svg>
