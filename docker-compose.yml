services:
  teleop-server:
    build:
      context: .
      network: host
    environment:
      - ROBOT_TYPE=${ROBOT_TYPE:-diff_drive}
      - ROBOT_NAME=${ROBOT_NAME:-}
      - ROBOT_NAMESPACE=${ROBOT_NAMESPACE:-}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-eth0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/tmp/fastrtps_resolved.xml
    restart: unless-stopped
    network_mode: "host"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9091"]
      interval: 30s
      timeout: 5s
      retries: 3

  webclient:
    build:
      context: ./web-client
      dockerfile: Dockerfile.webclient
      target: runtime
      network: host
    restart: unless-stopped

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile.auth
      target: runtime
      network: host
    ports:
      - "8080:3000"
    environment:
      - "TELEOP_ADMIN_USER=${TELEOP_ADMIN_USER:?Error: TELEOP_ADMIN_USER must be set}"
      - "TELEOP_ADMIN_PASSWORD=${TELEOP_ADMIN_PASSWORD:?Error: TELEOP_ADMIN_PASSWORD must be set}"
      - "SESSION_SECRET=${SESSION_SECRET:?Error: SESSION_SECRET must be set}"
      - "TELEOP_SERVER_URL=http://host.docker.internal:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - auth-data:/data
    depends_on:
      - webclient
      - teleop-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  webclient-test:
    profiles: ["test"]
    build:
      context: ./web-client
      dockerfile: Dockerfile.webclient
      target: base
      network: host
    environment:
      - TELEOP_SERVER_URL=ws://auth-server:3000/ws
    depends_on:
      - auth-server
    command: ["npm", "test"]

  auth-server-test:
    profiles: ["test"]
    build:
      context: ./auth-server
      dockerfile: Dockerfile.auth
      target: base
      network: host
    command: ["npm", "test"]

volumes:
  auth-data:
