services:
  teleop-server:
    build:
      context: .
      network: host
    environment:
      - ROBOT_TYPE=${ROBOT_TYPE:-diff_drive}
      - ROBOT_NAME=${ROBOT_NAME:-}
      - ROBOT_NAMESPACE=${ROBOT_NAMESPACE:-}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-eth0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/tmp/fastrtps_resolved.xml
    restart: unless-stopped
    network_mode: "host"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9091"]
      interval: 30s
      timeout: 5s
      retries: 3

  webclient:
    build:
      context: ./web-client
      dockerfile: Dockerfile.webclient
      target: runtime
      network: host
    ports:
      # Expose nginx on loopback only — auth-server (host network) proxies to it.
      # Not accessible from the network directly; all traffic goes through auth-server:8080.
      - "127.0.0.1:18080:80"
    restart: unless-stopped

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile.auth
      target: runtime
      network: host
    # Host networking: auth-server reaches teleop-server at localhost:9091 and
    # webclient at localhost:18080 without crossing Docker bridge/UFW boundaries.
    network_mode: "host"
    environment:
      - "TELEOP_ADMIN_USER=${TELEOP_ADMIN_USER:?Error: TELEOP_ADMIN_USER must be set}"
      - "TELEOP_ADMIN_PASSWORD=${TELEOP_ADMIN_PASSWORD:?Error: TELEOP_ADMIN_PASSWORD must be set}"
      - "SESSION_SECRET=${SESSION_SECRET:?Error: SESSION_SECRET must be set}"
      - PORT=8080
      - TELEOP_SERVER_URL=http://localhost:9091
      - WEBCLIENT_URL=http://localhost:18080
    volumes:
      - auth-data:/data
    depends_on:
      - webclient
      - teleop-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  webclient-test:
    profiles: ["test"]
    build:
      context: ./web-client
      dockerfile: Dockerfile.webclient
      target: base
      network: host
    # auth-server is on host network; reach it via the test container's gateway
    network_mode: "host"
    environment:
      - TELEOP_SERVER_URL=ws://localhost:8080/ws
    depends_on:
      - auth-server
    command: ["npm", "test"]

  auth-server-test:
    profiles: ["test"]
    build:
      context: ./auth-server
      dockerfile: Dockerfile.auth
      target: base
      network: host
    command: ["npm", "test"]

volumes:
  auth-data:
