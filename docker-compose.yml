services:
  teleop-server:
    build:
      context: .
      network: host
    environment:
      - ROBOT_TYPE=${ROBOT_TYPE:-diff_drive}
      - ROBOT_NAME=${ROBOT_NAME:-}
      - ROBOT_NAMESPACE=${ROBOT_NAMESPACE:-}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-eth0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/tmp/fastrtps_resolved.xml
    restart: unless-stopped
    network_mode: "host"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9091"]
      interval: 30s
      timeout: 5s
      retries: 3

  webclient:
    build:
      context: ./web-client
      dockerfile: Dockerfile.webclient
      target: runtime
      network: host
    ports:
      # Expose nginx on loopback only — auth-server (host network) proxies to it.
      # Not accessible from the network directly; all traffic goes through auth-server:8080.
      - "127.0.0.1:18080:80"
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    network_mode: "host"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  video-bridge:
    build:
      context: .
      dockerfile: video-bridge/Dockerfile.video_bridge
      network: host
    network_mode: "host"
    environment:
      - VIDEO_TOPIC=${VIDEO_TOPIC:-}
      - VIDEO_TOPIC_TYPE=${VIDEO_TOPIC_TYPE:-compressed}
      - MEDIAMTX_RTSP=rtsp://localhost:8554/teleop
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-}
    restart: unless-stopped
    depends_on:
      - mediamtx

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile.auth
      target: runtime
      network: host
    # Host networking: auth-server reaches teleop-server at localhost:9091 and
    # webclient at localhost:18080 without crossing Docker bridge/UFW boundaries.
    network_mode: "host"
    environment:
      - "TELEOP_ADMIN_USER=${TELEOP_ADMIN_USER:?Error: TELEOP_ADMIN_USER must be set}"
      - "TELEOP_ADMIN_PASSWORD=${TELEOP_ADMIN_PASSWORD:?Error: TELEOP_ADMIN_PASSWORD must be set}"
      - "SESSION_SECRET=${SESSION_SECRET:?Error: SESSION_SECRET must be set}"
      - PORT=8080
      - TELEOP_SERVER_URL=http://localhost:9091
      - WEBCLIENT_URL=http://localhost:18080
      - MEDIAMTX_URL=http://localhost:8889
    volumes:
      - auth-data:/data
    depends_on:
      - webclient
      - teleop-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  webclient-test:
    profiles: ["test"]
    build:
      context: ./web-client
      dockerfile: Dockerfile.webclient
      target: base
      network: host
    # auth-server is on host network; reach it via the test container's gateway
    network_mode: "host"
    environment:
      - TELEOP_SERVER_URL=ws://localhost:8080/ws
    depends_on:
      - auth-server
    command: ["npm", "test"]

  auth-server-test:
    profiles: ["test"]
    build:
      context: ./auth-server
      dockerfile: Dockerfile.auth
      target: base
      network: host
    command: ["npm", "test"]

  video-bridge-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: video-bridge/Dockerfile.video_bridge
      target: test
      network: host
    command: ["/bin/bash", "-c", ". /opt/ros/humble/setup.sh && python3 -m pytest /test_video_bridge.py -v"]

  # integration profile: real MediaMTX instance for Apply-button e2e tests.
  # mediamtx image is scratch-based (no shell tools), so health is polled by the
  # test's beforeAll rather than a Docker HEALTHCHECK.
  mediamtx-test:
    profiles: ["integration"]
    image: bluenviron/mediamtx:latest
    network_mode: "host"
    volumes:
      - ./mediamtx-test-config.yml:/mediamtx.yml:ro

  mediamtx-integration-test:
    profiles: ["integration"]
    build:
      context: ./auth-server
      dockerfile: Dockerfile.auth
      target: base
      network: host
    network_mode: "host"
    environment:
      - MEDIAMTX_API_URL=http://localhost:9997
    depends_on:
      - mediamtx-test
    command: ["npx", "vitest", "run", "test/mediamtx_integration.test.ts"]

volumes:
  auth-data:
