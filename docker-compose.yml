# Compose file with robot config overrides via env_file mechanism.
#
# Overrides flow:
#   .env (secrets: TELEOP_ADMIN_USER, SESSION_SECRET, ROS network params, TLS config)
#         +
#   config/robot.env (operator-configurable via web settings: ROBOT_TYPE, VIDEO_TOPIC, footprint, etc.)
#         =
#   Final container environment
#
# Note: Robot identity keys (ROBOT_TYPE, ROBOT_NAME, etc.) are intentionally removed
# from the 'environment' section below — if hardcoded there, they would shadow (override)
# the config/robot.env values loaded via env_file. This allows the web settings page
# to write config/robot.env at runtime without needing a container restart.

services:
  teleop-server:
    build:
      context: .
      network: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-eth0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/tmp/fastrtps_resolved.xml
      - ODOM_TOPIC=${ODOM_TOPIC:-}
      - MAP_TOPIC=${MAP_TOPIC:-}
      - MAP_WINDOW_M=${MAP_WINDOW_M:-}
      - SCAN_TOPIC=${SCAN_TOPIC:-}
      - BATTERY_TOPIC=${BATTERY_TOPIC:-}
      - MAP_FRAME=${MAP_FRAME:-}
      - ODOM_FRAME=${ODOM_FRAME:-}
      - BASE_FRAME=${BASE_FRAME:-}
      - NAV_PATH_TOPIC=${NAV_PATH_TOPIC:-}
      - NAV_GOAL_FRAME=${NAV_GOAL_FRAME:-}
      # Disconnect-after behavior. Non-empty fallbacks so the launch file's
      # int parse (DISCONNECT_ACTION_PARAM) never sees an empty string.
      - DISCONNECT_ACTION=${DISCONNECT_ACTION:-stop}
      - DISCONNECT_ACTION_PARAM=${DISCONNECT_ACTION_PARAM:-0}
      - RETURN_HOME_SERVICE=${RETURN_HOME_SERVICE:-/return_home}
    env_file:
      - path: ./config/robot.env
        required: false
    restart: unless-stopped
    network_mode: "host"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9091"]
      interval: 30s
      timeout: 5s
      retries: 3

  webclient:
    build:
      context: ./web-client
      dockerfile: Dockerfile.webclient
      target: runtime
      network: host
    ports:
      # Expose nginx on loopback only — auth-server (host network) proxies to it.
      # Not accessible from the network directly; all traffic goes through auth-server:8080.
      - "127.0.0.1:18080:80"
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    network_mode: "host"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  video-bridge:
    build:
      context: .
      dockerfile: video-bridge/Dockerfile.video_bridge
      target: runtime
      network: host
    network_mode: "host"
    environment:
      - MEDIAMTX_RTMP=rtmp://127.0.0.1:1935/teleop
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_NETWORK_INTERFACE=${ROS_NETWORK_INTERFACE:-}
    env_file:
      - path: ./config/robot.env
        required: false
    restart: unless-stopped
    depends_on:
      - mediamtx

  # TLS frontend — opt-in via `--profile tls`. Host networking so Caddy reaches
  # auth-server at localhost:8080 and owns 80/443 directly. Cert mode is picked
  # inside the Caddyfile from TLS_ACME_EMAIL (set = Let's Encrypt, empty =
  # internal self-signed CA). The localhost fallback for TLS_DOMAIN keeps
  # `compose config` green for plain-HTTP users; real TLS deployments must set
  # it in .env.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    network_mode: "host"
    environment:
      - "TLS_DOMAIN=${TLS_DOMAIN:-localhost}"
      # Caddyfile `tls` directive arg: an ACME email enables Let's Encrypt;
      # "internal" (the fallback when TLS_ACME_EMAIL is empty) self-signs.
      - "TLS_CERT_MODE=${TLS_ACME_EMAIL:-internal}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist certs + ACME account — losing them risks Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - auth-server
    restart: unless-stopped

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile.auth
      target: runtime
      network: host
    # Host networking: auth-server reaches teleop-server at localhost:9091 and
    # webclient at localhost:18080 without crossing Docker bridge/UFW boundaries.
    network_mode: "host"
    environment:
      - "TELEOP_ADMIN_USER=${TELEOP_ADMIN_USER:?Error: TELEOP_ADMIN_USER must be set}"
      - "TELEOP_ADMIN_PASSWORD=${TELEOP_ADMIN_PASSWORD:?Error: TELEOP_ADMIN_PASSWORD must be set}"
      - "SESSION_SECRET=${SESSION_SECRET:?Error: SESSION_SECRET must be set}"
      - PORT=8080
      - "BIND_HOST=${BIND_HOST:-0.0.0.0}"
      - TELEOP_SERVER_URL=http://localhost:9091
      - WEBCLIENT_URL=http://localhost:18080
      - MEDIAMTX_URL=http://localhost:8889
    volumes:
      - auth-data:/data
      - ./config:/config
    depends_on:
      - webclient
      - teleop-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  webclient-test:
    profiles: ["test"]
    build:
      context: ./web-client
      dockerfile: Dockerfile.webclient
      target: base
      network: host
    # auth-server is on host network; reach it via the test container's gateway
    network_mode: "host"
    environment:
      - TELEOP_SERVER_URL=ws://localhost:8080/ws
    depends_on:
      - auth-server
    command: ["npm", "test"]

  auth-server-test:
    profiles: ["test"]
    build:
      context: ./auth-server
      dockerfile: Dockerfile.auth
      target: base
      network: host
    command: ["npm", "test"]

  video-bridge-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: video-bridge/Dockerfile.video_bridge
      target: test
      network: host
    command: ["/bin/bash", "-c", ". /opt/ros/humble/setup.sh && python3 -m pytest /test_video_bridge.py -v"]

  # integration profile: real MediaMTX instance for Apply-button e2e tests.
  # mediamtx image is scratch-based (no shell tools), so health is polled by the
  # test's beforeAll rather than a Docker HEALTHCHECK.
  mediamtx-test:
    profiles: ["integration"]
    image: bluenviron/mediamtx:latest
    network_mode: "host"
    volumes:
      - ./mediamtx-test-config.yml:/mediamtx.yml:ro

  mediamtx-integration-test:
    profiles: ["integration"]
    build:
      context: ./auth-server
      dockerfile: Dockerfile.auth
      target: base
      network: host
    network_mode: "host"
    environment:
      - MEDIAMTX_API_URL=http://localhost:9997
    depends_on:
      - mediamtx-test
    command: ["npx", "vitest", "run", "test/mediamtx_integration.test.ts"]

volumes:
  auth-data:
  caddy-data:
  caddy-config:
