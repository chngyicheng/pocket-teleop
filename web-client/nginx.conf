# Custom nginx server for the web client.
#
# The default nginx:alpine config ships gzip OFF, so the ~190 KB JS bundle was
# served uncompressed (it gzips to ~58 KB). Over the slow + variable robot-AP
# link that ~3x byte bloat was the dominant white-screen cost (measured: bundle
# transfer 1.7 s good-case, ~7 s bad-case). gzip on cuts the download ~3x.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Hashed build assets (index-<hash>.js / .css) are immutable — cache hard so
    # repeat loads skip the download entirely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker must revalidate on every request so updates are picked up.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # index.html must revalidate so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
