<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>pocket-teleop</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0e12;
      --surface: #14171e;
      --surface2: #1a1e26;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #8a92a3;
      --accent: #f0a92a;
      --accent2: #4ec9d6;
      --danger: #ef4444;
      --ok: #22c55e;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
    }

    /* Mission app layout */
    .mission-app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header — host is a passthrough wrapper; layout lives on .mission-header itself */
    .mission-header-host {
      flex: 0 0 auto;
      display: block;
    }

    .mission-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .mission-phone-landscape .mission-header { height: 36px; }
    .mission-phone-portrait .mission-header { height: 44px; }
    .mission-tablet .mission-header { height: 52px; padding: 0 16px; gap: 12px; }

    .mh-menu {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      padding: 6px 8px;
      flex: 0 0 auto;
    }

    .mh-title {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mh-robot {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 9px;
      font-weight: 600;
      color: var(--accent);
      flex: 0 0 auto;
    }

    .mh-chip {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      flex: 0 0 auto;
      padding: 3px 7px;
      border-radius: 2px;
      border: 1px solid;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .mh-chip-live          { color: var(--ok);     border-color: var(--ok);     }
    .mh-chip-reconnecting  { color: var(--accent); border-color: var(--accent); }
    .mh-chip-disconnected  { color: var(--danger); border-color: var(--danger); }

    .mh-estop {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 3px;
      padding: 4px 8px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      flex: 0 0 auto;
      white-space: nowrap;
      z-index: 10;
    }

    .mission-phone-landscape .mh-estop,
    .mission-phone-portrait .mh-estop {
      padding: 4px 8px;
    }

    .mission-tablet .mh-estop {
      padding: 6px 12px;
    }

    .mh-estop:hover {
      opacity: 0.9;
    }

    /* Main viewport — block container hosting absolutely-positioned children */
    .mission-main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .mission-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
      transition: opacity 0.2s;
      z-index: 0;
    }

    .mission-video.dim {
      opacity: 0.4;
    }

    /* Overlay containers */
    .mission-velbars-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
    }

    .mission-phone-landscape .mission-velbars-overlay {
      width: 200px;
    }

    .mission-tablet .mission-velbars-overlay {
      display: none;
    }

    .mission-telemetry-overlay {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
    }

    .mission-minimap-overlay {
      position: absolute;
      bottom: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 2;
    }

    .mission-mode-chip {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text);
      background: rgba(8,10,14,0.7);
      padding: 4px 10px;
      border-radius: 2px;
      border: 1px solid var(--border);
      z-index: 2;
    }

    .mission-reticle {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
      z-index: 1;
    }
    .mission-tablet .mission-reticle { width: 80px; height: 80px; }

    .mission-reticle::before,
    .mission-reticle::after {
      content: '';
      position: absolute;
      background: var(--accent);
      opacity: 0.4;
    }

    .mission-reticle::before {
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      transform: translateX(-50%);
    }

    .mission-reticle::after {
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      transform: translateY(-50%);
    }

    /* Joystick zones */
    .mission-joystick {
      position: absolute;
      bottom: 0;
      z-index: 5;
      touch-action: none;
      user-select: none;
    }

    .mission-phone-landscape .mission-joystick,
    .mission-phone-portrait .mission-joystick {
      width: 230px;
      height: 230px;
    }

    .mission-tablet .mission-joystick {
      width: 280px;
      height: 280px;
    }

    .mission-joystick-drive {
      left: 0;
    }

    .mission-joystick-strafe {
      right: 0;
    }

    /* HUD Components */
    .vel-bar-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .vel-bar-label {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 9px;
      color: var(--muted);
      font-weight: 500;
      min-width: 20px;
    }

    .vel-bar-track {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.08);
      position: relative;
      border-radius: 2px;
    }

    .vel-bar-fill {
      position: absolute;
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      left: 50%;
      transform: translateX(-50%);
    }

    .vel-bar-value {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 9px;
      color: var(--accent);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      min-width: 30px;
      text-align: right;
    }

    .readout {
      background: rgba(8,10,14,0.55);
      backdrop-filter: blur(6px);
      padding: 3px 8px;
      display: flex;
      gap: 6px;
      align-items: baseline;
      border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.05);
      white-space: nowrap;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
    }

    .readout-label {
      opacity: 0.5;
      letter-spacing: 0.1em;
    }

    .readout-value {
      color: var(--accent);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Mini-map */
    .mini-map {
      width: 110px;
      height: 110px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }

    .mission-tablet .mini-map {
      width: 200px;
      height: 200px;
    }

    .mini-map-svg {
      width: 100%;
      height: 100%;
      position: absolute;
    }

    .mini-map-grid {
      stroke: var(--border);
      stroke-width: 0.5;
      opacity: 0.3;
    }

    .mini-map-polyline {
      stroke: var(--accent);
      stroke-width: 1.5;
      fill: none;
      opacity: 0.7;
    }

    .mini-map-arrow {
      fill: var(--accent);
    }

    /* Compass */
    .compass {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .compass-svg {
      width: 28px;
      height: 28px;
    }

    .mission-tablet .compass-svg {
      width: 44px;
      height: 44px;
    }

    .compass-circle {
      fill: none;
      stroke: var(--border);
      stroke-width: 1;
    }

    .compass-needle {
      fill: var(--accent);
    }

    .compass-label {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      color: var(--accent);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      min-width: 32px;
    }

    /* Joystick primitives */
    .mj-base {
      border: 2px solid;
      opacity: 0.7;
      pointer-events: none;
    }

    .mj-knob {
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
      pointer-events: none;
    }

    .mj-hint {
      border-radius: 50%;
      opacity: 0.4;
      pointer-events: none;
    }

    .mj-label {
      position: absolute;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.5;
      pointer-events: none;
    }

    /* Phone vs tablet layouts */
    @media (min-width: 900px) {
      .mission-app {
        grid-template-columns: 220px 1fr 240px;
        grid-template-rows: 52px 1fr;
      }
    }

    @media (orientation: portrait) {
      .mission-phone-portrait .mission-joystick {
        width: 190px;
        height: 190px;
      }
    }

    #app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { startMissionApp } from './dist/mission_app.js';

    const root = document.getElementById('app');

    // Determine layout
    let layout = 'phone-landscape';
    if (window.matchMedia('(min-width: 900px)').matches) {
      layout = 'tablet';
    } else if (window.matchMedia('(orientation: portrait)').matches) {
      layout = 'phone-portrait';
    }

    // Build URLs
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const teleopUrl = `${proto}//${location.host}/teleop`;
    const whepUrl = `${location.protocol}//${location.host}/video/teleop/whep`;

    // Start app
    startMissionApp({
      root,
      layout,
      teleopUrl,
      whepUrl,
    });
  </script>
</body>
</html>
