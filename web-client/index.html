<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/jetbrains-mono-latin.woff2" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>Pocket Teleop</title>
    <!-- Critical inline styles: paint a dark splash immediately on HTML parse,
         before index.css or the JS bundle load, so the operator never sees a
         white screen during bundle download+execute. React's createRoot
         replaces #app's children on first commit, removing the splash. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0c0e12; color: #8a92a3; }
      #boot-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #0c0e12;
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      #boot-splash .boot-mark { font-size: 13px; letter-spacing: 0.28em; color: #f0a92a; font-weight: 600; }
      #boot-splash .boot-spinner {
        width: 26px; height: 26px;
        border: 2px solid #2a2f3a; border-top-color: #f0a92a; border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-splash .boot-status { font-size: 10px; letter-spacing: 0.22em; opacity: 0.6; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-splash">
        <div class="boot-mark">POCKET-TELEOP</div>
        <div class="boot-spinner"></div>
        <div class="boot-status">INITIALIZING…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
