<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pocket-teleop · Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #f5f5f5; --border: #e0e0e0;
      --text: #111111; --text-muted: #666666; --accent: #0070f3;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text); background: var(--bg);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111111; --surface: #1e1e1e; --border: #333333;
              --text: #f0f0f0; --text-muted: #999999; }
    }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 20px; padding: 32px; background: var(--bg); }
    .title { font-family: 'Press Start 2P', monospace; font-size: 13px; color: var(--accent); }
    form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; background: var(--surface); color: var(--text);
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; padding: 10px; background: var(--accent); color: #fff;
      border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
    }
    button:active { opacity: 0.85; }
    .error { font-size: 12px; color: #ef4444; text-align: center; display: none; }
    .pw-wrap { display: flex; align-items: center; gap: 8px; }
    .pw-wrap input { flex: 1; }
    .eyeball {
      flex-shrink: 0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0; line-height: 0;
    }
    .eyeball:hover { color: var(--text); }
  </style>
</head>
<body>
  <span class="title">pocket-teleop</span>
  <form method="POST" action="/auth/login" id="form">
    <input type="text"     name="username" placeholder="Username" autocomplete="username" required>
    <div class="pw-wrap">
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="eyeball" aria-label="Show password"></button>
    </div>
    <button type="submit">Connect</button>
  </form>
  <p class="error" id="err">Invalid username or password.</p>
  <script>
    // Show error if redirected back with ?error=1
    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('err').style.display = 'block';
    }

    // Eyeball toggle
    const EYE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const EYE_SLASH_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
    document.querySelectorAll('.eyeball').forEach((btn) => {
      btn.innerHTML = EYE_SVG;
      btn.addEventListener('click', () => {
        const input = btn.previousElementSibling;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        btn.innerHTML = show ? EYE_SLASH_SVG : EYE_SVG;
      });
    });
  </script>
</body>
</html>
